name: Tooling safety scanner tests

on:
  pull_request:
    paths:
      - '.github/scripts/pr-tooling-safety*.cjs'
      - '.github/workflows/labelops-pr-security-scan*'
      - '.github/workflows/tooling-safety-tests.yml'
  push:
    branches: [main]
    paths:
      - '.github/scripts/pr-tooling-safety*.cjs'
      - '.github/workflows/labelops-pr-security-scan*'
      - '.github/workflows/tooling-safety-tests.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - run: node --test .github/scripts/pr-tooling-safety.test.cjs
