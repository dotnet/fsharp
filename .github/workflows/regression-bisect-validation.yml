name: Regression investigation validation
on:
  pull_request:
    paths:
      - '.gitattributes'
      - 'eng/regression-bisect/**'
      - '.github/regression-bisect/**'
      - '.github/policies/regression-bisect.json'
      - '.github/workflows/regression-bisect*'
      - '.github/workflows/shared/model-defaults.md'
      - '.github/aw/actions-lock.json'
  push:
    branches: ['idea/dm-912']
    paths:
      - '.gitattributes'
      - 'eng/regression-bisect/**'
      - '.github/regression-bisect/**'
      - '.github/policies/regression-bisect.json'
      - '.github/workflows/regression-bisect*'
      - '.github/workflows/shared/model-defaults.md'
      - '.github/aw/actions-lock.json'
permissions:
  contents: read
concurrency:
  group: regression-bisect-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        env:
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: 'false'
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
      - name: Compile twice with the isolated fleet compiler
        timeout-minutes: 15
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $compiler = Join-Path $env:RUNNER_TEMP 'gh-aw-v0.76.1.exe'
          Invoke-WebRequest 'https://github.com/github/gh-aw/releases/download/v0.76.1/windows-amd64.exe' -OutFile $compiler
          if ((Get-FileHash $compiler -Algorithm SHA256).Hash.ToLower() -ne
              'fb8789c9ed8fc3c7d36c50659e6171268bb8cc13e95206aed20600fe82942e57') { throw 'Compiler digest mismatch' }
          $expected = (Get-FileHash '.github\workflows\regression-bisect.lock.yml').Hash
          foreach ($pass in 1, 2) {
            $p = Start-Process $compiler -ArgumentList 'compile','regression-bisect','--strict','--no-check-update' `
              -NoNewWindow -PassThru -RedirectStandardOutput "$env:RUNNER_TEMP\compile-$pass.stdout" `
              -RedirectStandardError "$env:RUNNER_TEMP\compile-$pass.stderr"
            if (-not $p.WaitForExit(420000)) { Stop-Process -Id $p.Id; throw 'Compile timeout' }
            Get-Content "$env:RUNNER_TEMP\compile-$pass.stdout", "$env:RUNNER_TEMP\compile-$pass.stderr"
            if ($p.ExitCode -ne 0) { throw 'Compile failed' }
            if ((Get-FileHash '.github\workflows\regression-bisect.lock.yml').Hash -ne $expected) { throw 'Compiled lock differs' }
          }
      - name: Verify Windows process supervisor
        shell: pwsh
        run: |
          $probe = @'
          const path = require("node:path");
          const { spawnSync } = require("node:child_process");
          const { execute } = require("./eng/regression-bisect/repro-process.cjs");
          (async () => {
            const started = Date.now(), env = {SystemRoot:process.env.SystemRoot};
            const script = "if (JSON.stringify(Object.keys(process.env).sort()) !== '[\"SystemRoot\"]') throw new Error('sample environment changed'); console.log('SUPERVISOR_READY')";
            const result = await execute(process.execPath, ["-e", script],
              {cwd:process.cwd(),env,timeoutMs:10000});
            console.log(JSON.stringify({node:process.version,elapsedMs:Date.now()-started,result}));
            if (result.complete && result.exitCode === 0 && result.stdout === "SUPERVISOR_READY\n") return;
            const helper = path.resolve("eng/regression-bisect/repro-process.ps1");
            const powershell = path.join(env.SystemRoot,"System32","WindowsPowerShell","v1.0","powershell.exe");
            const command = `Set-PSDebug -Trace 1; & '${helper.replaceAll("'","''")}' 'SUPERVISOR_DIAGNOSTIC:'`;
            const request = JSON.stringify({executable:process.execPath,args:["-e",script],
              environment:[`SystemRoot=${env.SystemRoot}`]})+"\n";
            for (const mode of ["isolated","inherited"]) {
              const trace = spawnSync(powershell,["-NoProfile","-NonInteractive","-ExecutionPolicy","Bypass","-Command",command],
                {env:mode==="isolated"?env:process.env,input:request,encoding:"utf8",timeout:15000,maxBuffer:65536,windowsHide:true});
              console.log(JSON.stringify({diagnosticOnly:mode,status:trace.status,error:trace.error?.code,
                stdout:trace.stdout?.slice(-16000),stderr:trace.stderr?.slice(-4000)}));
            }
            process.exitCode = 1;
          })().catch(error => {console.error(error.message);process.exitCode=1;});
          '@
          $probe | node
          if ($LASTEXITCODE -ne 0) { throw 'Windows supervisor did not complete its harmless preflight' }
      - name: Offline scoped suite
        timeout-minutes: 30
        shell: pwsh
        run: |
          npm ci --prefix eng\regression-bisect --ignore-scripts --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw 'Parser restore failed' }
          $tests = @(Get-ChildItem 'eng\regression-bisect' -Filter '*.test.cjs' | ForEach-Object FullName)
          node --test --test-concurrency=4 @tests
          if ($LASTEXITCODE -ne 0) { throw 'Scoped suite failed' }
          git diff --exit-code
          if ($LASTEXITCODE -ne 0) { throw 'Generated files changed' }
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw 'Diff check failed' }
  containment:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
      - name: Provision the pinned image
        run: docker pull --platform linux/amd64 docker.io/library/node@sha256:5a750d3be5e5c80275f8c9a5367c3aed99c2875656590c8d0701c7ee687f5f0a
      - name: Write smoke configuration
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const path = require("node:path");
          fs.writeFileSync(path.join(process.env.RUNNER_TEMP, "regression-containment-config.json"), JSON.stringify({
            schemaVersion: 1,
            image: "docker.io/library/node@sha256:5a750d3be5e5c80275f8c9a5367c3aed99c2875656590c8d0701c7ee687f5f0a",
            dockerExecutable: "/usr/bin/docker",
            limits: { cpus: 1, memoryMiB: 1024, pids: 128, scratchMiB: 64, timeoutMs: 120000 }
          }), { flag: "wx" });
          NODE
      - name: Run real Linux containment
        run: node eng/regression-bisect/containment.smoke.cjs --run "$RUNNER_TEMP/regression-containment-config.json" "$RUNNER_TEMP/regression-containment"
      - name: Retain containment evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: regression-containment-${{ github.sha }}
          path: |
            ${{ runner.temp }}/regression-containment
            ${{ runner.temp }}/regression-containment-config.json
          if-no-files-found: error
  source-worker:
    if: github.event_name == 'push' && (contains(github.event.head_commit.message, '[source-acceptance]') || contains(github.event.head_commit.message, '[worker-acceptance]'))
    needs: [validate, containment]
    runs-on: ubuntu-24.04
    timeout-minutes: 130
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
      - name: Provision the pinned image
        run: docker pull --platform linux/amd64 docker.io/library/node@sha256:5a750d3be5e5c80275f8c9a5367c3aed99c2875656590c8d0701c7ee687f5f0a
      - name: Write reviewed source configuration
        run: |
          node <<'NODE'
          const fs = require("node:fs"), path = require("node:path");
          fs.writeFileSync(path.join(process.env.RUNNER_TEMP, "regression-source-config.json"), JSON.stringify({
            schemaVersion: 1,
            image: "docker.io/library/node@sha256:5a750d3be5e5c80275f8c9a5367c3aed99c2875656590c8d0701c7ee687f5f0a",
            dockerExecutable: "/usr/bin/docker",
            limits: { cpus: 4, memoryMiB: 12288, pids: 1024, scratchMiB: 8192, timeoutMs: 6600000 }
          }), { flag: "wx" });
          NODE
      - name: Verify this source worker's containment
        run: node eng/regression-bisect/containment.smoke.cjs --run "$RUNNER_TEMP/regression-source-config.json" "$RUNNER_TEMP/regression-source-containment"
      - name: Build and test the frozen source inside the production worker
        env:
          RB_CONTROLLER_ACCEPTANCE: ${{ contains(github.event.head_commit.message, '[worker-acceptance]') }}
        run: |
          if [ "$RB_CONTROLLER_ACCEPTANCE" = true ]; then
            node eng/regression-bisect/source-worker.smoke.cjs --controller "$RUNNER_TEMP/regression-source-config.json" "$RUNNER_TEMP/regression-source-worker" "$RUNNER_TEMP/regression-source-containment"
          else
            node eng/regression-bisect/source-worker.smoke.cjs --run "$RUNNER_TEMP/regression-source-config.json" "$RUNNER_TEMP/regression-source-worker"
          fi
      - name: Retain source worker evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: regression-source-worker-${{ github.sha }}
          path: |
            ${{ runner.temp }}/regression-source-config.json
            ${{ runner.temp }}/regression-source-containment
            ${{ runner.temp }}/regression-source-worker
          if-no-files-found: error
