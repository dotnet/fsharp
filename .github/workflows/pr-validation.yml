name: PR Validation (F# VS Integration)

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  validate-and-trigger:
    if: |
      github.repository == 'dotnet/fsharp' &&
      github.event.issue.pull_request &&
      (contains(github.event.comment.body, '/pr-val') || contains(github.event.comment.body, '/dart'))
    runs-on: ubuntu-latest
    environment: fsharp_pr_validation
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # issue_comment's SHA is on the default branch, never the PR branch.
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Validate request and capture PR revision
        id: request
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: .\.github\scripts\pr-validation.ps1 -Mode Prepare

      - name: Get Microsoft membership lookup token
        id: membership-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ secrets.MICROSOFT_MEMBERS_APP_ID }}
          private-key: ${{ secrets.MICROSOFT_MEMBERS_APP_PRIVATE_KEY }}
          owner: microsoft
          permission-members: read

      - name: Verify Microsoft organization membership
        env:
          GITHUB_TOKEN: ${{ steps.membership-token.outputs.token }}
        run: .\.github\scripts\pr-validation.ps1 -Mode Membership

      - name: Azure Login with OpenID Connect
        uses: azure/login@8216e11d8cd9b42fe925c852af8e76311ff067ac # v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Queue DartLab pipeline
        id: queue
        env:
          PIPELINE_ID: ${{ vars.FSHARP_APEX_PIPELINE_ID }}
          REQUEST_BODY: ${{ steps.request.outputs.body }}
        run: |
          $ErrorActionPreference = 'Stop'
          $env:AZDO_TOKEN = az account get-access-token --resource 499b84ac-1321-427f-aa17-267ca6975798 --query accessToken -o tsv
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($env:AZDO_TOKEN)) { throw 'Azure did not return an access token.' }
          Write-Output "::add-mask::$env:AZDO_TOKEN"
          .\.github\scripts\pr-validation.ps1 -Mode Queue

      - name: Report request result
        if: success() || failure()
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RUN_URL: ${{ steps.queue.outputs.url }}
          HEAD_SHA: ${{ steps.request.outputs.head }}
          BASE_SHA: ${{ steps.request.outputs.base }}
        run: .\.github\scripts\pr-validation.ps1 -Mode Report
