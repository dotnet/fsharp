# F# 15.9 servicing pipeline (definition 499): 1ES-PT official build.
# Extends MicroBuild.1ES.Official and runs eng\CIBuild.cmd on a Windows VS2022 image.
# Signing and VS insertion are added later in the insertion build.

trigger:
  branches:
    include:
      - release/dev15.9.x
pr: none

variables:
  - name: _TeamName
    value: FSharp
  - name: TeamName
    value: FSharp
  - name: _BuildConfig
    value: Release
  - name: Codeql.Enabled
    value: 'false'
  # Signing replicates dotnet/fsharp main's official signed build: real ESRP signing via the 1ES mb.signing
  # block + the DotNet-DevDiv-Insertion-Workflow-Variables group (already authorized for this repo) +
  # OfficialBuildId (so Arcade applies real signatures instead of dry-running).
  - name: _SignType
    value: Real
  # VS insertion drop name (same convention as dotnet/fsharp main). The drop is uploaded to the devdiv artifact
  # service and referenced by the VS insertion PR.
  - name: VisualStudioDropName
    value: Products/$(System.TeamProject)/$(Build.Repository.Name)/$(Build.SourceBranchName)/$(Build.BuildNumber)
  # Automated VS insertion PR (MicroBuildInsertVsPayload). Set _InsertVS to 'true' to open the F# 15.9 insertion
  # PR against the VS 2017 15.9 servicing branch (rel/d15.9). Left 'false' so the pipeline is fully wired but does
  # not create a VS PR until deliberately enabled. Mirrors main's insert-into-vs.yml variable contract.
  - name: _InsertVS
    value: 'false'
  - name: InsertTargetBranch
    value: rel/d15.9
  - name: InsertTeamEmail
    value: fsharpteam@microsoft.com
  - name: InsertTeamName
    value: 'F#'
  - name: InsertConfigValues
    value: ''
  - name: InsertBuildPolicy
    value: 'Request Perf DDRITs'

resources:
  repositories:
    - repository: MicroBuildTemplate
      type: git
      name: 1ESPipelineTemplates/MicroBuildTemplate
      ref: refs/tags/release

extends:
  template: azure-pipelines/MicroBuild.1ES.Official.yml@MicroBuildTemplate
  parameters:
    pool:
      name: NetCore1ESPool-Svc-Internal
      image: 1es-windows-2022
      os: windows
    sdl:
      sourceAnalysisPool:
        name: NetCore1ESPool-Svc-Internal
        image: 1es-windows-2022
        os: windows
    stages:
      - stage: Build
        displayName: 'F# 15.9 Build (Windows Release)'
        jobs:
          - job: BuildWindows
            displayName: 'Build Windows Release'
            timeoutInMinutes: 120
            variables:
              - group: DotNet-DevDiv-Insertion-Workflow-Variables
            pool:
              name: NetCore1ESPool-Svc-Internal
              image: windows.vs2022.amd64
              os: windows
            templateContext:
              mb:
                signing:
                  enabled: true
                  signWithProd: true
                  feedSource: https://dnceng.pkgs.visualstudio.com/_packaging/MicroBuildToolset/nuget/v3/index.json
                  signType: $(_SignType)
                  zipSources: false
              outputs:
                - output: pipelineArtifact
                  displayName: 'Publish binary log'
                  condition: always()
                  targetPath: '$(Build.SourcesDirectory)/artifacts/log/$(_BuildConfig)'
                  artifactName: 'BuildLogs'
                  sbomEnabled: false
                - output: pipelineArtifact
                  displayName: 'Publish product drop'
                  condition: succeeded()
                  targetPath: '$(Build.SourcesDirectory)/release/net40/bin'
                  artifactName: 'Product_net40'
                  sbomEnabled: false
                - output: pipelineArtifact
                  displayName: 'Publish insertion VSIX'
                  condition: succeededOrFailed()
                  targetPath: '$(Build.SourcesDirectory)/vsintegration/Vsix/VisualFSharpFull/bin/Release'
                  artifactName: 'VSIX'
                  sbomEnabled: false
                - output: pipelineArtifact
                  displayName: 'Publish lean insertion drop (.vsman)'
                  condition: succeededOrFailed()
                  targetPath: '$(Build.SourcesDirectory)/release/insertion'
                  artifactName: 'InsertionDrop'
                  sbomEnabled: false
            steps:
              - checkout: self
                clean: true
                fetchDepth: 1
              # Authenticate the devdiv dotnet-core-internal-tooling feed (main's read-only connection, confirmed
              # authorized for 499 by build 3030418) so CIBuild Step 7 can restore the modern MicroBuild SwixBuild
              # plugin for the .vsman drop. Harmless when BUILD_VSMAN is unset.
              - task: NuGetAuthenticate@1
                displayName: 'Authenticate devdiv/dotnet-core-internal-tooling (SwixBuild plugin feed)'
                inputs:
                  nuGetServiceConnections: 'devdiv/dotnet-core-internal-tooling'
                  forceReinstallCredentialProvider: true
              - script: eng\CIBuild.cmd -configuration $(_BuildConfig)
                displayName: 'Build (product) + tests + insertion VSIX + sign + lean .vsman'
                env:
                  DisableLocalization: true
                  BUILD_INSERTION: 1
                  BUILD_VSMAN: 1
                  SignType: $(_SignType)
                  OfficialBuildId: $(Build.BuildNumber)
              # Upload the produced .vsman insertion drop to the devdiv artifact service, exactly like main:
              # get a DevDiv drop token via the WIF connection main uses (dnceng-devdiv-drop-rw-code-rw-wif) -
              # confirmed authorized for 499 (build 3031405) - then 1ES.MicroBuildVstsDrop. The upload prints the
              # vsdrop manifest URL that the VS insertion step consumes.
              - task: AzureCLI@2
                displayName: 'Get DevDiv Drop Access Token'
                condition: succeeded()
                inputs:
                  azureSubscription: 'dnceng-devdiv-drop-rw-code-rw-wif'
                  scriptType: pscore
                  scriptLocation: inlineScript
                  inlineScript: |
                    $token = az account get-access-token --resource 499b84ac-1321-427f-aa17-267ca6975798 --query accessToken -o tsv
                    Write-Host "##vso[task.setvariable variable=DevDivDropAccessToken;issecret=true]$token"
              - task: 1ES.MicroBuildVstsDrop@1
                displayName: 'Upload VSTS Drop (.vsman insertion drop)'
                condition: succeeded()
                inputs:
                  dropName: $(VisualStudioDropName)
                  dropFolder: '$(Build.SourcesDirectory)/release/insertion'
                  dropRetentionDays: 90
                  accessToken: $(DevDivDropAccessToken)
                  dropServiceUri: 'https://devdiv.artifacts.visualstudio.com'
                  vsDropServiceUri: 'https://vsdrop.corp.microsoft.com/file/v1'
              # Automated VS insertion PR (gated on _InsertVS). Constructs the .vsman component payload value from
              # the deterministic vsdrop URL (no log scanning), gets a VS-insertion token via the same WIF
              # connection main uses (dnceng-fsharp-vs-insertion-wif), and opens the PR against rel/d15.9 via
              # MicroBuildInsertVsPayload@5. Lean: only the VSIX .vsman component (no default.config nupkgs, per the
              # no-new-FSharp.Core-nupkg constraint). AutoComplete stays false (rel branch) so a human reviews the PR.
              - powershell: |
                  $bv = "15.9.$(Build.BuildNumber)"
                  $url = "https://vsdrop.corp.microsoft.com/file/v1/$(VisualStudioDropName);Microsoft.FSharp.vsman"
                  Write-Host "##vso[task.setvariable variable=InsertJsonValues]Microsoft.FSharp.vsman{$bv}=$url"
                  Write-Host "##vso[task.setvariable variable=InsertPayloadName]F# 15.9 $(Build.SourceBranchName) $(Build.BuildNumber)"
                  Write-Host "##vso[task.setvariable variable=InsertAutoComplete]false"
                  Write-Host "InsertJsonValues = Microsoft.FSharp.vsman{$bv}=$url"
                displayName: 'Set VS insertion payload values'
                condition: and(succeeded(), eq(variables._InsertVS, 'true'))
              - task: AzureCLI@2
                displayName: 'Get VS insertion access token'
                condition: and(succeeded(), eq(variables._InsertVS, 'true'))
                inputs:
                  azureSubscription: 'dnceng-fsharp-vs-insertion-wif'
                  scriptType: pscore
                  scriptLocation: inlineScript
                  inlineScript: |
                    $token = az account get-access-token --resource "499b84ac-1321-427f-aa17-267ca6975798" --query accessToken -o tsv
                    Write-Host "##vso[task.setvariable variable=InsertAccessToken;issecret=true]$token"
              - script: git config --global credential.helper ""
                displayName: 'Disable GCM (Entra token too large for credential store)'
                condition: and(succeeded(), eq(variables._InsertVS, 'true'))
              - task: ms-vseng.MicroBuildShipTasks.55100717-a81d-45ea-a363-b8fe3ec375ad.MicroBuildInsertVsPayload@5
                displayName: 'Insert F# 15.9 VSIX into VS (rel/d15.9)'
                condition: and(succeeded(), eq(variables._InsertVS, 'true'))
                inputs:
                  LinkWorkItemsToPR: false
              - task: PublishTestResults@2
                displayName: 'Publish test results'
                condition: always()
                inputs:
                  testResultsFormat: 'NUnit'
                  testResultsFiles: '$(Build.SourcesDirectory)/artifacts/TestResults/*.xml'
                  failTaskOnFailedTests: true
