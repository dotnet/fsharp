# Template for F# Compiler Regression Tests
# Tests third-party F# projects with the freshly built compiler
#
# buildScript notation:
#   - Single command:   buildScript: dotnet build MySolution.slnx
#   - Multiple commands: buildScript: dotnet build A.fsproj ;; dotnet build B.fsproj
#     Commands separated by ';;' run sequentially; the job fails on the first non-zero exit code.

parameters:
- name: testMatrix
  type: object
- name: dependsOn
  type:  string
  default: 'EndToEndBuildTests'

jobs:
- ${{ each item in parameters.testMatrix }}:
  - job: RegressionTest_${{ replace(replace(item.displayName, '-', '_'), '.', '_') }}_${{ replace(replace(replace(item.repo, '/', '_'), '-', '_'), '.', '_') }}
    displayName:  '${{ item.displayName }} Regression Test'
    dependsOn: ${{ parameters.dependsOn }}
    ${{ if item.useVmImage }}:
      pool:
        ${{ if item.usePool }}:
          name: ${{ item.usePool }}
          demands: ImageOverride -equals ${{ item.useVmImage }}
        ${{ else }}:
          vmImage: ${{ item.useVmImage }}
    ${{ else }}:
      pool:
        name: $(DncEngPublicBuildPool)
        demands:  ImageOverride -equals $(_WindowsMachineQueueName)
    timeoutInMinutes: 120
    steps:
    - checkout: self
      displayName: Checkout F# compiler repo (for scripts)

    - task: DownloadPipelineArtifact@2
      displayName: Download F# Compiler FSC Artifacts
      inputs: 
        artifactName: 'FSharpCompilerFscArtifacts'
        downloadPath: '$(Pipeline.Workspace)/FSharpCompiler/artifacts/bin/fsc'

    - task: DownloadPipelineArtifact@2
      displayName: Download F# Core Artifacts
      inputs:
        artifactName: 'FSharpCoreArtifacts'
        downloadPath: '$(Pipeline.Workspace)/FSharpCompiler/artifacts/bin/FSharp.Core'

    - task: DownloadPipelineArtifact@2
      displayName:  Download UseLocalCompiler props
      inputs:
        artifactName: 'UseLocalCompilerProps'
        downloadPath: '$(Pipeline.Workspace)/Props'

    - pwsh: |
        Write-Host "Cloning repository:  ${{ item.repo }}"
        git clone --recursive https://github.com/${{ item.repo }}.git $(Pipeline.Workspace)/TestRepo
        Set-Location $(Pipeline.Workspace)/TestRepo
        
        Write-Host "Checking out commit:  ${{ item.commit }}"
        git checkout ${{ item.commit }}
        
        Write-Host "Initializing submodules (if any)..."
        git submodule update --init --recursive
        
        Write-Host "Successfully checked out ${{ item.repo }} at commit ${{ item.commit }}"
        git log -1 --oneline

        Write-Host "Repository structure:"
        Get-ChildItem -Name
      displayName:  Checkout ${{ item.displayName }} at specific commit

    - pwsh: |
        Set-Location $(Pipeline.Workspace)/TestRepo
        # Pin the test repo to the exact SDK that built the compiler (allowPrerelease + rollForward:disable) so its
        # F# SDK targets and the runtime that runs the local fsc.dll line up, with no silent fallback.
        $sdk = (Get-Content "$(Build.SourcesDirectory)/global.json" | ConvertFrom-Json).sdk.version
        @{ sdk = @{ version = $sdk; allowPrerelease = $true; rollForward = "disable" } } | ConvertTo-Json | Set-Content "global.json"
        Write-Host "Pinned test repo to SDK $sdk"
        Get-Content "global.json"
      displayName: Pin global.json to compiler SDK for ${{ item.displayName }}

    - task: UseDotNet@2
      displayName:  Install .NET SDK 8.0.x for ${{ item.displayName }}
      inputs:
        packageType: sdk
        version: '8.0.x'
        installationPath: $(Pipeline.Workspace)/TestRepo/.dotnet

    - task: UseDotNet@2
      displayName:  Install .NET SDK 9.0.x for ${{ item.displayName }}
      inputs:
        packageType: sdk
        version: '9.0.x'
        installationPath: $(Pipeline.Workspace)/TestRepo/.dotnet

    - pwsh: |
        # Clean leftover SDK extraction directories in agent temp to prevent
        # UseDotNet@2 "file already exists" errors when installing multiple SDKs sequentially.
        # The task extracts to a temp folder before moving to installationPath, but doesn't
        # always clean up between runs on the same agent.
        $tempDir = $env:AGENT_TEMPDIRECTORY
        if ($tempDir -and (Test-Path $tempDir)) {
          Get-ChildItem $tempDir -Directory -ErrorAction SilentlyContinue |
            Where-Object {
              (Test-Path (Join-Path $_.FullName "dotnet.exe")) -and
              ((Test-Path (Join-Path $_.FullName "sdk")) -or (Test-Path (Join-Path $_.FullName "host")) -or (Test-Path (Join-Path $_.FullName "shared")))
            } |
            ForEach-Object {
              Write-Host "Removing leftover dotnet extraction dir: $($_.FullName)"
              Remove-Item $_.FullName -Recurse -Force -ErrorAction Stop
            }
        }
      displayName: Clean UseDotNet temp extraction directories for ${{ item.displayName }}

    - task: UseDotNet@2
      displayName:  Install .NET SDK 10.0.100 for ${{ item.displayName }}
      inputs:
        packageType: sdk
        version: '10.0.100'
        installationPath: $(Pipeline.Workspace)/TestRepo/.dotnet

    # Install the SDK that built the compiler (version from global.json)
    # into the regression test's .dotnet so fsc.dll can find the runtime.
    # Tries default feed first, then ci.dot.net/public (same fallback as eng/common).
    - pwsh: |
        $v = (Get-Content "$(Build.SourcesDirectory)/global.json" | ConvertFrom-Json).sdk.version
        $d = "$(Pipeline.Workspace)/TestRepo/.dotnet"
        $u = "https://builds.dotnet.microsoft.com/dotnet/scripts/v1"
        if ($IsWindows) {
          Invoke-WebRequest "$u/dotnet-install.ps1" -OutFile "$d/dotnet-install.ps1"
          & "$d/dotnet-install.ps1" -Version $v -InstallDir $d -SkipNonVersionedFiles
          if ($LASTEXITCODE -ne 0) {
            & "$d/dotnet-install.ps1" -Version $v -InstallDir $d -SkipNonVersionedFiles -AzureFeed "https://ci.dot.net/public"
          }
        } else {
          Invoke-WebRequest "$u/dotnet-install.sh" -OutFile "$d/dotnet-install.sh"
          chmod +x "$d/dotnet-install.sh"
          bash "$d/dotnet-install.sh" --version $v --install-dir $d --skip-non-versioned-files ||
            bash "$d/dotnet-install.sh" --version $v --install-dir $d --skip-non-versioned-files --azure-feed "https://ci.dot.net/public"
        }
      displayName: Install compiler SDK for ${{ item.displayName }}

    - pwsh: |
        Set-Location $(Pipeline.Workspace)/TestRepo
        Write-Host "==========================================="
        Write-Host "Environment Information for ${{ item.displayName }}"
        Write-Host "==========================================="
        dotnet --info
        Write-Host ""
        Write-Host "MSBuild version:"
        dotnet msbuild -version
        Write-Host ""
        Write-Host "F# Compiler artifacts available:"
        $productTfm = (dotnet msbuild "$(Pipeline.Workspace)/Props/TargetFrameworks.props" --getProperty:FSharpNetCoreProductTargetFramework).Trim()
        Get-ChildItem "$(Pipeline.Workspace)/FSharpCompiler/artifacts/bin/fsc/Release/$productTfm" -Name -ErrorAction SilentlyContinue
        Write-Host ""
        Write-Host "F# Core available:"
        if (Test-Path "$(Pipeline.Workspace)/FSharpCompiler/artifacts/bin/FSharp.Core/Release/netstandard2.0/FSharp.Core.dll") {
          Write-Host "FSharp.Core.dll found"
        } else {
          Write-Host "FSharp.Core.dll not found"
        }
        Write-Host ""
        Write-Host "Directory.Build.props content (none if injected via CustomAfterDirectoryBuildProps):"
        Get-Content "Directory.Build.props" -ErrorAction SilentlyContinue
        Write-Host ""
        Write-Host "==========================================="
      displayName: Report build environment for ${{ item.displayName }}

    - pwsh: |
        Set-Location $(Pipeline.Workspace)/TestRepo
        if (Test-Path ".config/dotnet-tools.json") {
          Write-Host "Restoring dotnet tools..."
          dotnet tool restore
          Write-Host "Tool restore exit code: $LASTEXITCODE"
        } else {
          Write-Host "No dotnet-tools.json found, skipping tool restore"
        }
      displayName: Restore dotnet tools for ${{ item.displayName }}
      continueOnError: true

    - pwsh: |
        Set-Location $(Pipeline.Workspace)/TestRepo
        $errorLogPath = "$(Pipeline.Workspace)/build-errors.log"
        $fullLogPath = "$(Pipeline.Workspace)/build-full.log"
        
        # Function to filter and capture important lines
        function Process-BuildOutput {
          param([string]$line)
          Write-Host $line
          if ($line -match ':  error ' -or 
              $line -match ': warning ' -or 
              $line -match 'FAILED|Failed!' -or
              $line -match '^\s+X\s+' -or
              $line -match 'Exception: ' -or
              $line -match '^\s+at\s+.*\(\)' -or
              $line -match 'Build FAILED') {
            Add-Content -Path $errorLogPath -Value $line
          }
        }

        # Build logic lives in the fsx so a failure reproduces with the same one command, no pipeline required.
        $fsxArgs = @(
          "$(Build.SourcesDirectory)/eng/scripts/BuildWithLocalFSharp.fsx",
          '--compiler-path', "$(Pipeline.Workspace)/FSharpCompiler",
          '--props', "$(Pipeline.Workspace)/Props/UseLocalCompiler.Directory.Build.props",
          '--core-packages-dir', "$(Pipeline.Workspace)/Props/library-packs",
          '--nuget-packages', "$(Pipeline.Workspace)/.nuget-packages",
          '--build-script', '${{ item.buildScript }}'
        )
        if ('${{ item.expectLocalCore }}' -eq 'True') { $fsxArgs += '--verify' }

        dotnet fsi @fsxArgs 2>&1 | Tee-Object -FilePath $fullLogPath -Append | ForEach-Object { Process-BuildOutput $_ }
        $code = $LASTEXITCODE
        if ($code -ne 0) {
          Write-Host "##[error]Build failed for ${{ item.displayName }} (exit code $code)"
          exit $code
        }
      displayName:  Build ${{ item.displayName }} with local F# compiler
      timeoutInMinutes:  120

    - pwsh:  |
        Set-Location $(Pipeline.Workspace)/TestRepo
        $binlogDir = "$(Pipeline.Workspace)/BinaryLogs"
        New-Item -ItemType Directory -Force -Path $binlogDir | Out-Null

        Write-Host "Collecting .binlog files..."
        $binlogs = Get-ChildItem -Path "." -Filter "*.binlog" -Recurse -ErrorAction SilentlyContinue
        if ($binlogs.Count -eq 0) {
          Write-Host "No .binlog files found"
        } else {
          foreach ($binlog in $binlogs) {
            Write-Host "Copying:  $($binlog.FullName)"
            Copy-Item $binlog.FullName -Destination $binlogDir
          }
          Write-Host "Collected $($binlogs.Count) .binlog files"
        }
      displayName:  Collect Binary Logs
      condition: always()
      continueOnError: true

    - pwsh: |
        $binlogDir = "$(Pipeline.Workspace)/BinaryLogs"
        $script = "$(Build.SourcesDirectory)/eng/scripts/ExtractTimingsFromBinlog.fsx"
        
        if (-not (Test-Path $binlogDir)) {
          Write-Host "No binary logs directory found, skipping timing extraction"
          exit 0
        }
        
        $binlogs = Get-ChildItem -Path $binlogDir -Filter "*.binlog" -ErrorAction SilentlyContinue
        if ($binlogs.Count -eq 0) {
          Write-Host "No binlog files found, skipping timing extraction"
          exit 0
        }
        
        # Copy script to BinaryLogs dir so dotnet fsi doesn't inherit fsharp repo's global.json
        # (which pins an SDK version not installed in the regression test job)
        Copy-Item $script $binlogDir/
        $localScript = Join-Path $binlogDir (Split-Path $script -Leaf)
        
        Write-Host "##[group]F# Compiler Timing Summary for ${{ item.displayName }}"
        foreach ($bl in $binlogs) {
          Write-Host ""
          Write-Host "--- Timings from $($bl.Name) ---"
          dotnet fsi $localScript "$($bl.FullName)"
        }
        Write-Host "##[endgroup]"
      displayName: Extract compiler timing from binlogs for ${{ item.displayName }}
      condition: always()
      continueOnError: true
      workingDirectory: '$(Pipeline.Workspace)/BinaryLogs'

    - task: PublishPipelineArtifact@1
      displayName:  Publish ${{ item.displayName }} Binary Logs
      inputs: 
        targetPath: '$(Pipeline.Workspace)/BinaryLogs'
        artifactName: '${{ item.displayName }}_BinaryLogs'
        publishLocation: pipeline
      condition: always()
      continueOnError: true

    - pwsh: |
        Set-Location $(Pipeline.Workspace)/TestRepo
        Write-Host ""
        Write-Host "============================================"
        Write-Host "Regression test completed for ${{ item.displayName }}"
        Write-Host "Repository: ${{ item.repo }}"
        Write-Host "Commit: ${{ item.commit }}"
        Write-Host "Build Script: ${{ item.buildScript }}"
        
        if ($env:AGENT_JOBSTATUS -eq "Succeeded" -or $env:AGENT_JOBSTATUS -eq "SucceededWithIssues") {
          Write-Host "Status: SUCCESS"
          Write-Host "The ${{ item.displayName }} library builds successfully with the new F# compiler"
        } else {
          Write-Host "Status: FAILED"
          Write-Host "The ${{ item.displayName }} library failed to build with the new F# compiler"
          
          $errorLogPath = "$(Pipeline.Workspace)/build-errors.log"
          if (Test-Path $errorLogPath) {
            Write-Host ""
            Write-Host "##[error]============================================"
            Write-Host "##[error]FAILURE SUMMARY for ${{ item.displayName }}"
            Write-Host "##[error]============================================"
            
            $errors = Get-Content $errorLogPath | Select-Object -First 100
            $errorCount = 0
            $warningCount = 0
            $testFailCount = 0
            
            foreach ($line in $errors) {
              if ($line -match ': error ') {
                Write-Host "##[error]$line"
                $errorCount++
              } elseif ($line -match ': warning ') {
                Write-Host "##[warning]$line"
                $warningCount++
              } elseif ($line -match 'FAILED|Failed! |^\s+X\s+') {
                Write-Host "##[error][TEST] $line"
                $testFailCount++
              } else {
                Write-Host "##[error]$line"
              }
            }
            
            $totalLines = (Get-Content $errorLogPath | Measure-Object -Line).Lines
            if ($totalLines -gt 100) {
              Write-Host "##[warning]... and $($totalLines - 100) more lines (see full log or binary logs)"
            }
            
            Write-Host ""
            Write-Host "##[error]Summary: $errorCount error(s), $warningCount warning(s), $testFailCount test failure(s)"
            Write-Host "##[error]============================================"
          } else {
            Write-Host "##[warning]No error log captured - check full build output above"
          }
          
          Write-Host ""
          $verifyFlag = if ('${{ item.expectLocalCore }}' -eq 'True') { ' --verify' } else { '' }
          Write-Host "##[section]LOCAL REPRODUCTION (any OS; FSHARP_REPO = your dotnet/fsharp checkout built with build.sh/Build.cmd -c Release -pack):"
          Write-Host "git clone --recursive https://github.com/${{ item.repo }}.git TestRepo"
          Write-Host "cd TestRepo; git checkout ${{ item.commit }}; git submodule update --init --recursive"
          Write-Host 'BUILD_COMMAND: ${{ item.buildScript }}'
          Write-Host "dotnet fsi FSHARP_REPO/eng/scripts/BuildWithLocalFSharp.fsx$verifyFlag --build-script '<BUILD_COMMAND above>'"
          Write-Host "#    If TestRepo/global.json pins a different SDK, align sdk.version to your compiler SDK (rollForward: disable); add --nuget-packages <dir> to isolate restore."

          Write-Host "##vso[task.logissue type=error;sourcepath=azure-pipelines-PR.yml]Regression test failed: ${{ item.displayName }}"
        }
        Write-Host "============================================"
        
        Write-Host ""
        Write-Host "Binary logs found:"
        Get-ChildItem "*.binlog" -Recurse -ErrorAction SilentlyContinue | ForEach-Object { Write-Host $_.FullName }
      displayName: Report ${{ item.displayName }} test result
      condition: always()
