<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="598" viewBox="0 0 1100 598" role="img" aria-labelledby="title desc">
<title id="title">The allocation gains also reach .NET Framework</title><desc id="desc">New allocation as percent of the older payload, normalized separately within each runtime. FSharp.Core: .NET Framework 4.8.1 74.2, .NET 10.0.0 73.9, .NET 11 RC1 73.8. FSharp.Compiler.Service: .NET Framework 4.8.1 75.4, .NET 10.0.0 77.0, .NET 11 RC1 77.1. FsToolkit.ErrorHandling: .NET Framework 4.8.1 78.3, .NET 10.0.0 77.7, .NET 11 RC1 77.7. Oxpecker: .NET Framework 4.8.1 51.3, .NET 10.0.0 51.1, .NET 11 RC1 51.1. Nu: .NET Framework 4.8.1 77.2, .NET 10.0.0 77.4, .NET 11 RC1 77.2. FsAutoComplete: .NET Framework 4.8.1 77.8, .NET 10.0.0 77.9, .NET 11 RC1 77.9.</desc>
<style>text{font-family:Segoe UI,Arial,sans-serif;font-size:16px;fill:#172b3a}.title{font-size:27px;font-weight:700}.label{font-weight:600}.small{font-size:14px;fill:#405466}.grid{stroke:#d7e0e6;stroke-width:1}.axis{stroke:#6b7d8a;stroke-width:1}</style>
